name: Daily OFZ Assistant

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  run-assistant:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install https://github.com/Invest-SDK/invest-python/raw/refs/heads/master/t_tech_investments-1.51.0-py3-none-any.whl

      - name: Run assistant
        env:
          TINKOFF_TOKEN: ${{ secrets.TINKOFF_TOKEN }}
          TINKOFF_TOKEN_2: ${{ secrets.TINKOFF_TOKEN_2 }}
        run: python main.py

      - name: Send Report Email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "OFZ Assistant Report"
          to: ${{ secrets.MAIL_TO }}
          from: OFZ Assistant <${{ secrets.MAIL_USERNAME }}>
          body: file://report.txt
